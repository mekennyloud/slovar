<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Словарь</title>
  <meta name="description" content="Англо-русский словарь Мюллера, работает без интернета">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Словарь">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <button class="back" id="back" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <form class="search" id="form" role="search" autocomplete="off">
      <svg class="loupe" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Найти слово" aria-label="Поиск"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button type="button" class="clear" id="clear" aria-label="Стереть" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="var(--bg)" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>
  </header>

  <main id="main">
    <p class="status" id="status">Загружаю словарь…</p>
    <ul class="list" id="list"></ul>
    <article class="entry" id="entry" hidden></article>
  </main>

  <div class="tip" id="tip" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
